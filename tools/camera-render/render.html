<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>@font-face{font-family:Nunito;font-weight:800;src:url(./node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format('woff2')}html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1600), H = +(P.get('h') || 1200);
const COLOR = P.get('color') || 'graphite';
const VIEW = P.get('view') || 'front';
const DARK = P.get('bg') === 'dark';
const PAN = +(P.get('pan') || 0);     // head yaw, degrees
const TILT = +(P.get('tilt') || 6);   // head pitch, degrees (up)

const BODY = {
  graphite: { c: 0x3a3b3e, rough: 0.62, logo: '#f2f2f2' },
  white:    { c: 0xeeedea, rough: 0.58, logo: '#2b2b2d' },
  red:      { c: 0xb8232b, rough: 0.6,  logo: '#f7f2f0' },
}[COLOR];

await document.fonts.load('800 100px Nunito');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = DARK ? 1.0 : (COLOR === 'white' ? 1.22 : 1.1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
function studio() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.SphereGeometry(120, 64, 32), new THREE.MeshBasicMaterial({ color: DARK ? 0x050505 : 0x4a4a4c, side: THREE.BackSide }));
  env.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshBasicMaterial({ color: DARK ? 0x020202 : 0x6c6c6e }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2; env.add(floor);
  // feathered softbox: bright centre, soft falloff to the edges
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(128, 128, 10, 128, 128, 128);
  g.addColorStop(0, '#fff'); g.addColorStop(0.55, '#d0d0d0'); g.addColorStop(1, '#000');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
  const soft = new THREE.CanvasTexture(cv);
  const box = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: soft, color: new THREE.Color(k, k, k), side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.set(x, y, z); m.lookAt(0, 6, 0); env.add(m);
  };
  box(26, 18, -22, 30, 22, DARK ? 6 : 5);   // big top-left softbox (key)
  box(8, 40, 34, 10, 6, DARK ? 3 : 2.2);     // tall right strip
  box(30, 8, 0, 40, -20, DARK ? 3.5 : 2);    // top back rim
  box(10, 30, -34, 8, -14, DARK ? 2.5 : 1.2);// left back strip
  box(34, 10, 14, 34, 44, DARK ? 4 : 3.2);    // overhead softbox behind camera
  box(12, 5, 4, 27, 46, DARK ? 3.4 : 3.2);    // small bright panel: highlight at the glass's upper right
  box(34, 22, -12, 12, 46, DARK ? 0.18 : 0.16); // broad dim panel: soft sheen across the glass
  box(6, 24, -30, 14, 38, DARK ? 1.5 : 1.4);  // low left kicker
  return env;
}
scene.environment = pmrem.fromScene(studio(), 0.02).texture;
scene.environmentIntensity = DARK ? 0.55 : 0.85;

/* ---------------- materials ---------------- */
const body = new THREE.MeshPhysicalMaterial({ color: BODY.c, roughness: BODY.rough, metalness: 0, clearcoat: 0.15, clearcoatRoughness: 0.5, sheen: 0.2, sheenRoughness: 0.8 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x020203, roughness: 0.03, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02, ior: 1.5, specularIntensity: 1 });
const glassInner = new THREE.MeshPhysicalMaterial({ color: 0x141418, roughness: 0.18, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 });
const rimMat = new THREE.MeshPhysicalMaterial({ color: 0x0e0e10, roughness: 0.25, metalness: 0.6 });
const lensRing = new THREE.MeshPhysicalMaterial({ color: 0x1a1b1e, roughness: 0.28, metalness: 0.85 });
const lensGlass = new THREE.MeshPhysicalMaterial({ color: 0x0a1020, roughness: 0.02, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0, iridescence: 0.6, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 500] });
const holeMat = new THREE.MeshStandardMaterial({ color: 0x060606, roughness: 0.9 });
const portMat = new THREE.MeshStandardMaterial({ color: 0x111112, roughness: 0.5, metalness: 0.4 });

/* ---------------- helpers ---------------- */
// Rounded-corner lathe profile: [radius, y] points for a capped cylinder with fillets.
function roundedProfile(R, y0, y1, r0, r1, seg = 10) {
  const pts = [new THREE.Vector2(0, y0)];
  for (let i = 0; i <= seg; i++) { const a = -Math.PI / 2 + (i / seg) * (Math.PI / 2); pts.push(new THREE.Vector2(R - r0 + Math.cos(a) * r0, y0 + r0 + Math.sin(a) * r0)); }
  for (let i = 0; i <= seg; i++) { const a = (i / seg) * (Math.PI / 2); pts.push(new THREE.Vector2(R - r1 + Math.cos(a) * r1, y1 - r1 + Math.sin(a) * r1)); }
  pts.push(new THREE.Vector2(0, y1));
  return pts;
}
function lathe(pts, segs = 160) {
  const g = new THREE.LatheGeometry(pts, segs);
  g.computeVertexNormals();
  return g;
}
const mesh = (g, m, cast = true) => { const o = new THREE.Mesh(g, m); o.castShadow = cast; o.receiveShadow = true; return o; };

/* ---------------- base ---------------- */
const BASE_R = 3.7, BASE_H = 4.4;
const product = new THREE.Group();
scene.add(product);

const baseLower = mesh(lathe(roundedProfile(BASE_R, 0, BASE_H - 0.95, 0.35, 0.06)), body);
const baseCap = mesh(lathe(roundedProfile(BASE_R - 0.02, BASE_H - 0.9, BASE_H, 0.06, 0.32)), body);
product.add(baseLower, baseCap);
// seam shadow line between body and rotating cap
const seam = mesh(new THREE.CylinderGeometry(BASE_R - 0.05, BASE_R - 0.05, 0.05, 160, 1, true), holeMat, false);
seam.position.y = BASE_H - 0.925;
product.add(seam);

// logo on the base front
{
  const cv = document.createElement('canvas'); cv.width = 2048; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = BODY.logo; ctx.font = '800 150px Nunito'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('alaro.', 1024, 256);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const span = 1.7; // radians covered by the canvas
  const g = new THREE.CylinderGeometry(BASE_R + 0.004, BASE_R + 0.004, 1.6, 96, 1, true, -span / 2 + 0.32, span);
  const logo = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ map: tex, transparent: true, roughness: 0.4, clearcoat: 0.3, depthWrite: false }));
  logo.position.y = 1.5;
  product.add(logo);
}
// USB-C port on the back
{
  const shape = new THREE.Shape();
  const w = 0.95, h = 0.32, r = 0.16;
  shape.moveTo(-w / 2 + r, -h / 2); shape.lineTo(w / 2 - r, -h / 2); shape.absarc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2); shape.lineTo(-w / 2 + r, h / 2); shape.absarc(-w / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5);
  const port = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.08, bevelEnabled: false }), portMat, false);
  port.position.set(0.3, 0.75, -BASE_R + 0.03); port.rotation.y = Math.PI;
  product.add(port);
  const frame = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.02, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.02, bevelSegments: 3 }), body, false);
  frame.position.set(0.3, 0.75, -BASE_R + 0.005); frame.rotation.y = Math.PI;
  product.add(frame);
}

/* ---------------- head (pan/tilt) ---------------- */
const HEAD_R = 4.1, HEAD_L = 4.6;
const panPivot = new THREE.Group(); panPivot.position.y = BASE_H; panPivot.rotation.y = THREE.MathUtils.degToRad(PAN);
product.add(panPivot);

// arm: rises from the base cap behind the head, up to the hinge on the head's back face
const HINGE_Y = 1.25 + HEAD_R; // head centre above the base top
const armShape = new THREE.Shape();
armShape.moveTo(-0.55, 0); armShape.lineTo(0.55, 0); armShape.lineTo(0.55, HINGE_Y); armShape.absarc(0, HINGE_Y, 0.55, 0, Math.PI); armShape.lineTo(-0.55, 0);
const armGeo = new THREE.ExtrudeGeometry(armShape, { depth: 0.5, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 4, curveSegments: 24 });
const arm = mesh(armGeo, body);
arm.position.set(0, -0.2, -HEAD_L / 2 - 0.62);
panPivot.add(arm);
// short stem under the head (visible from the front)
const stem = mesh(new THREE.BoxGeometry(1.0, 1.4, 1.2), body);
stem.position.set(0, 0.5, -HEAD_L / 2 - 0.1);
panPivot.add(stem);

const tiltPivot = new THREE.Group();
tiltPivot.position.set(0, HINGE_Y, 0);
tiltPivot.rotation.x = -THREE.MathUtils.degToRad(TILT);
panPivot.add(tiltPivot);

const head = new THREE.Group();
tiltPivot.add(head);
// shell: lathe along Y then rotate so its axis points +Z (forward)
const shell = mesh(lathe(roundedProfile(HEAD_R, -HEAD_L / 2, HEAD_L / 2 - 0.02, 0.3, 0.05), 200), body);
shell.rotation.x = Math.PI / 2;
head.add(shell);
// hinge knuckle on the back
const knuckle = mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.3, 48), body);
knuckle.rotation.z = Math.PI / 2; knuckle.position.set(0, 0, -HEAD_L / 2 - 0.45);
head.add(knuckle);
// back plate seam
const backRing = mesh(new THREE.TorusGeometry(HEAD_R * 0.62, 0.025, 8, 160), holeMat, false);
backRing.position.z = -HEAD_L / 2 - 0.005;
head.add(backRing);

// front: thin dark rim + glossy black glass face
const FRONT_Z = HEAD_L / 2 + 0.03;
const DOME_R = 24, APEX = FRONT_Z + 0.36;
const domeZ = (r) => APEX - (DOME_R - Math.sqrt(DOME_R * DOME_R - r * r));
const rim = mesh(new THREE.TorusGeometry(HEAD_R - 0.08, 0.12, 32, 240), rimMat, false);
rim.position.z = domeZ(HEAD_R - 0.1) - 0.02;
head.add(rim);
// the glass is a shallow dome, so it picks up a crescent from the overhead softbox
const domeCap = (radius, rr, mat) => {
  const g = new THREE.SphereGeometry(rr, 200, 48, 0, Math.PI * 2, 0, Math.asin(radius / rr));
  const m = mesh(g, mat, false);
  m.rotation.x = Math.PI / 2; m.position.z = APEX - DOME_R;
  return m;
};
head.add(domeCap(HEAD_R - 0.1, DOME_R, glass));
// darker inner window around the lens
head.add(domeCap(HEAD_R * 0.52, DOME_R + 0.012, glassInner));
// lens barrel + glass
const barrel = mesh(new THREE.CylinderGeometry(0.95, 1.02, 0.28, 96), lensRing, false);
barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.12, APEX + 0.1);
head.add(barrel);
const ring2 = mesh(new THREE.TorusGeometry(0.8, 0.07, 16, 96), lensRing, false);
ring2.position.set(0, 0.12, APEX + 0.25);
head.add(ring2);
const lens = mesh(new THREE.SphereGeometry(0.82, 64, 32, 0, Math.PI * 2, 0, Math.PI * 0.28), lensGlass, false);
lens.rotation.x = Math.PI / 2; lens.position.set(0, 0.12, APEX - 0.44);
head.add(lens);
const pupil = mesh(new THREE.CircleGeometry(0.3, 48), new THREE.MeshPhysicalMaterial({ color: 0x1b2a3a, roughness: 0.1, metalness: 0.5, clearcoat: 1 }), false);
pupil.position.set(0, 0.12, APEX + 0.235);
head.add(pupil);
// tiny sensor dots
for (const [y, r] of [[HEAD_R * 0.78, 0.07], [-HEAD_R * 0.48, 0.05]]) {
  const d = mesh(new THREE.CircleGeometry(r, 24), new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.3 }), false);
  d.position.set(0, y, domeZ(Math.abs(y)) + 0.02);
  head.add(d);
}
// speaker grille on the left flank, near the front
for (let col = 0; col < 4; col++) {
  for (let row = 0; row < 6; row++) {
    const ang = Math.PI + 0.2 - row * 0.085; // around the left side
    const z = HEAD_L / 2 - 0.55 - col * 0.32;
    const hole = mesh(new THREE.CircleGeometry(0.07, 16), holeMat, false);
    hole.position.set(Math.cos(ang) * (HEAD_R + 0.003), Math.sin(ang) * (HEAD_R + 0.003), z);
    hole.lookAt(hole.position.x * 2, hole.position.y * 2, z);
    head.add(hole);
  }
}

/* ---------------- ground + lights ---------------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: DARK ? 0.6 : 0.17 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
// soft contact shadow
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c = cv.getContext('2d'); const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.55, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(BASE_R * 2.6, BASE_R * 2.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.01;
  m.visible = P.get('mount') !== 'wall';
  scene.add(m);
}

const key = new THREE.DirectionalLight(0xffffff, DARK ? 2.2 : 2.4);
key.position.set(+(P.get('keyx') || -14), +(P.get('keyy') || 22), +(P.get('keyz') || 12)); key.castShadow = true;
key.shadow.mapSize.set(512, 512); key.shadow.radius = +(P.get('soft') || 10); key.shadow.blurSamples = 32; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 5, far: 80 });
// a finite ground so nothing beyond the shadow camera catches stray VSM bleed
ground.geometry = new THREE.CircleGeometry(30, 96);

// mount=wall: the camera stands on its small wall shelf, in front of a shadow-catching wall
if (P.get('mount') === 'wall') {
  ground.visible = false;
  const WALL_Z = -(BASE_R + 1.1);
  const shelfMat = body;
  const shelf = mesh(new THREE.CylinderGeometry(BASE_R + 0.5, BASE_R + 0.5, 0.45, 96), shelfMat);
  shelf.position.set(0, -0.24, -0.4);
  scene.add(shelf);
  const arm = mesh(new THREE.BoxGeometry(1.5, 0.45, BASE_R + 0.8), shelfMat);
  arm.position.set(0, -0.24, WALL_Z + (BASE_R + 0.8) / 2);
  scene.add(arm);
  const brace = mesh(new THREE.BoxGeometry(1.0, 2.6, 0.9), shelfMat);
  brace.position.set(0, -1.6, WALL_Z + 0.45);
  scene.add(brace);
  const plate = mesh(new THREE.BoxGeometry(2.4, 3.6, 0.3), shelfMat);
  plate.position.set(0, -1.4, WALL_Z + 0.15);
  scene.add(plate);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: +(P.get('wallshadow') || 0.32) }));
  wall.position.z = WALL_Z; wall.receiveShadow = true;
  scene.add(wall);
}
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, DARK ? 0.15 : 0.6); fill.position.set(16, 8, 10); scene.add(fill);
const rimL = new THREE.DirectionalLight(0xffffff, DARK ? 3.2 : 0.8); rimL.position.set(10, 14, -16); scene.add(rimL);
if (DARK) { const rim2 = new THREE.DirectionalLight(0xffffff, 2.2); rim2.position.set(-16, 6, -8); scene.add(rim2); }

/* ---------------- camera ---------------- */
const VIEWS = {
  front:  { pos: [10, 12, 44],  target: [0, 6.6, 0], fov: 24 },
  three4: { pos: [-16, 11, 40], target: [0, 6.6, 0], fov: 24 },
  rear:   { pos: [-14, 12, -42], target: [0, 6.6, 0], fov: 24 },
  detail: { pos: [-7, 11.8, 15], target: [0.6, 9.6, 0], fov: 32 },
  macro:  { pos: [-3, 10.6, 11], target: [0.4, 9.9, 0], fov: 34 },
  top:    { pos: [12, 30, 34], target: [0, 6.2, 0], fov: 22 },
};
// view=custom: cam=x,y,z & target=x,y,z & fov=n
const num = (k, d) => (P.get(k) ? P.get(k).split(',').map(Number) : d);
const v = VIEW === 'custom'
  ? { pos: num('cam', [0, 8, 40]), target: num('target', [0, 6.6, 0]), fov: +(P.get('fov') || 24) }
  : VIEWS[VIEW];
const cam = new THREE.PerspectiveCamera(v.fov, W / H, 0.1, 200);
cam.position.set(...v.pos); cam.lookAt(...v.target);

renderer.render(scene, cam);
// where the glass face, its centre and the status dot land on the canvas (0..1), for layouts that line up with them
{
  scene.updateMatrixWorld(true);
  const at = (x, y, z) => { const v = head.localToWorld(new THREE.Vector3(x, y, z)).project(cam); return [(v.x + 1) / 2, (1 - v.y) / 2]; };
  const r = HEAD_R - 0.1;
  window.__meta = {
    w: W, h: H,
    face: at(0, 0, APEX), faceRight: at(r, 0, domeZ(r)), faceLeft: at(-r, 0, domeZ(r)), faceTop: at(0, r, domeZ(r)), faceBottom: at(0, -r, domeZ(r)),
    lens: at(0, 0.12, APEX + 0.25), dot: at(0, HEAD_R * 0.78, domeZ(HEAD_R * 0.78)),
  };
}
window.__done = true;
</script>
</body>
