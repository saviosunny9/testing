<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createAlaroCamera, studioEnvironment } from './build/alaroCamera.js';

const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1600), H = +(P.get('h') || 1200);
const SCENE = P.get('scene') || 'grocery';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = studioEnvironment(renderer);
scene.environmentIntensity = 0.55;

// seeded random so renders are repeatable
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = (a) => a[Math.floor(rnd() * a.length)];
const PALETTE = [0x006bff, 0x0b3558, 0x8247f5, 0xff6b4a, 0xffc738, 0x16c79a, 0xf2f2f2, 0xe8e2d6, 0xd94f70, 0x5aa9ff];
const mat = (c, r = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const add = (g, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o; };

function rbox(w, h, d, r = 0.4) {
  const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelSize: 0.15, bevelThickness: 0.15, bevelSegments: 2 }); g.translate(0, 0, -d / 2); return g;
}
// a package with a white label band
function pack(w, h, d, color, x, y, z, parent) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  add(rbox(w, h, d, Math.min(w, h) * 0.08), mat(color, 0.6), 0, h / 2, 0, g);
  if (rnd() > 0.35) add(new THREE.BoxGeometry(w * 0.82, h * 0.22, 0.05), mat(0xffffff, 0.7), 0, h * 0.55, d / 2 + 0.16, g);
  return g;
}
function jar(r, h, color, lid, x, y, z, parent) {
  add(new THREE.CylinderGeometry(r, r, h, 32), new THREE.MeshPhysicalMaterial({ color, roughness: 0.25, clearcoat: 0.6 }), x, y + h / 2, z, parent);
  add(new THREE.CylinderGeometry(r * 1.02, r * 1.02, h * 0.16, 32), mat(lid, 0.4), x, y + h + h * 0.08, z, parent);
}

const wallMat = mat(0xf4f1ec, 0.95);
const wood = mat(0xc49a6c, 0.6);
const woodDark = mat(0x8a6a4a, 0.6);

if (SCENE === 'grocery') {
  // back wall + shelving unit stocked with goods
  add(new THREE.PlaneGeometry(400, 200), wallMat, 0, 60, -70);
  const shelf = new THREE.Group(); scene.add(shelf);
  for (let i = 0; i < 4; i++) {
    const y = -30 + i * 30;
    add(new THREE.BoxGeometry(220, 2, 34), mat(0xffffff, 0.5), 0, y, -50, shelf);
    let x = -105;
    while (x < 105) {
      const t = rnd();
      if (t < 0.55) { const w = 6 + rnd() * 8, h = 10 + rnd() * 14; pack(w, h, 8, pick(PALETTE), x + w / 2, y + 1, -45, shelf); x += w + 1.2; }
      else if (t < 0.85) { const r = 3 + rnd() * 2, h = 8 + rnd() * 8; jar(r, h, pick([0xffffff, 0xffe9a8, 0xf6d3c4, 0xd9f2e8]), pick(PALETTE), x + r, y + 1, -45, shelf); x += r * 2 + 1.2; }
      else { for (let k = 0; k < 3; k++) jar(2.6, 9, pick(PALETTE), 0xcfcfd4, x + 2.6 + k * 5.6, y + 1, -44, shelf); x += 17.5; }
    }
  }
  // wooden counter in front, the camera on it
  add(new THREE.BoxGeometry(160, 3, 46), wood, 0, -1.5, 8);
  add(new THREE.BoxGeometry(160, 60, 44), mat(0xffffff, 0.6), 0, -33, 8);
  jar(5, 16, 0xffffff, 0x006bff, -24, 0, 6, scene);
  jar(5, 16, 0xffffff, 0xff6b4a, -36, 0, 2, scene);
  pack(9, 2.6, 6, 0x0b3558, -6, 0, 16, scene); // card reader
}

if (SCENE === 'cafe') {
  add(new THREE.PlaneGeometry(400, 200), mat(0xe9eef6, 0.95), 0, 60, -60);
  // menu board and open shelf on the wall
  add(new THREE.BoxGeometry(70, 40, 1.5), mat(0x0b3558, 0.8), 30, 62, -59);
  for (let i = 0; i < 5; i++) add(new THREE.BoxGeometry(40 - (i % 2) * 12, 1.2, 0.3), mat(0xffffff, 0.8), 24 - (i % 2) * 6, 74 - i * 6, -58);
  add(new THREE.BoxGeometry(80, 2, 18), woodDark, -55, 40, -50);
  for (let i = 0; i < 6; i++) { const x = -88 + i * 12; add(new THREE.CylinderGeometry(4, 3, 8, 24), mat(pick([0xffffff, 0x006bff, 0xffc738, 0xff6b4a]), 0.4), x, 45, -50); }
  // counter
  add(new THREE.BoxGeometry(180, 3, 50), mat(0xf7f7f7, 0.35), 0, -1.5, 6);
  add(new THREE.BoxGeometry(180, 70, 48), wood, 0, -38, 6);
  // cups and a pastry stand
  for (const [x, z, c] of [[-30, 10, 0xffffff], [-20, 2, 0xffc738]]) { add(new THREE.CylinderGeometry(4, 3.2, 8, 32), mat(c, 0.3), x, 4, z); add(new THREE.TorusGeometry(2, 0.5, 8, 24), mat(c, 0.3), x + 4.5, 4.5, z); }
  add(new THREE.CylinderGeometry(14, 14, 1, 48), mat(0xffffff, 0.3), -50, 0.5, 4);
  for (let k = 0; k < 5; k++) add(new THREE.SphereGeometry(3.4, 24, 16), mat(0xd99a52, 0.7), -56 + (k % 3) * 6, 3.5, -1 + Math.floor(k / 3) * 7);
  add(new THREE.SphereGeometry(16, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, roughness: 0.05, thickness: 0.5, transparent: true, opacity: 0.35 }), -50, 1, 4);
  pack(9, 2.6, 6, 0x0b3558, 6, 0, 16, scene);
}

const cam = createAlaroCamera(P.get('color') || 'white');
cam.group.position.set(+(P.get('x') || 40), 0, +(P.get('z') || 10));
cam.group.rotation.y = THREE.MathUtils.degToRad(+(P.get('yaw') || -25));
cam.tilt.rotation.x = -THREE.MathUtils.degToRad(6);
scene.add(cam.group);

const key = new THREE.DirectionalLight(0xfff4e6, 2.2);
key.position.set(-60, 120, 80); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.blurSamples = 20; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -150, right: 150, top: 150, bottom: -150, near: 10, far: 400 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc4, 0.9));

const view = new THREE.PerspectiveCamera(+(P.get('fov') || 30), W / H, 1, 1000);
const c = (P.get('cam') || '70,28,95').split(',').map(Number);
const t = (P.get('target') || '20,10,-10').split(',').map(Number);
view.position.set(...c); view.lookAt(...t);
renderer.render(scene, view);
window.__done = true;
</script>
</body>
</html>
